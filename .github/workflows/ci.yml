name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web target
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint -- --max-warnings 3
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build

  cpp:
    name: Unreal source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install clang-format==20.1.0

      - name: Format check
        run: clang-format --dry-run --Werror $(find Source -name '*.h' -o -name '*.cpp')

      - name: Convention checks
        run: python tools/ci/check_cpp_conventions.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret and trademark scan
        run: python tools/ci/check_hygiene.py
