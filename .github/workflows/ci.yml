name: CI

on:
  push:
    branches: [main, 'phase/**', 'chore/**', 'fix/**', 'feat/**', 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: Unreal source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install clang-format==20.1.0

      - name: Format check
        run: clang-format --dry-run --Werror $(find Source -name '*.h' -o -name '*.cpp')

      - name: Convention checks
        run: python tools/ci/check_cpp_conventions.py

      - name: Reflection and log format checks
        run: python tools/ci/check_cpp_reflection.py

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: British spelling, dashes, JSON, dead links
        run: python tools/ci/check_docs.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret and trademark scan
        run: python tools/ci/check_hygiene.py

  content:
    name: Content asset integrity
    runs-on: ubuntu-latest
    steps:
      # No LFS pull: the check inspects committed blobs, which are pointers.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: LFS pointer integrity
        run: python tools/ci/check_content.py

  compile:
    name: Compile the editor target
    # Unreal Engine cannot be installed on a hosted runner, so a real compile
    # needs a self-hosted macOS runner with UE 5.8 and the Metal toolchain. This
    # job is opt in: register the runner, then set the repository variable
    # UNREAL_SELF_HOSTED to true. Without it the job is skipped rather than left
    # queued against a runner that does not exist, so the other gates still
    # report and a pull request is never blocked waiting on nothing.
    if: vars.UNREAL_SELF_HOSTED == 'true'
    runs-on: [self-hosted, macOS, unreal]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build LastTrainEditor
        run: ./tools/ci/compile.sh
