name: CI

on:
  push:
    branches: [main, 'phase/**', 'chore/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: Unreal source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install clang-format==20.1.0

      - name: Format check
        run: clang-format --dry-run --Werror $(find Source -name '*.h' -o -name '*.cpp')

      - name: Convention checks
        run: python tools/ci/check_cpp_conventions.py

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: British spelling, dashes, JSON, dead links
        run: python tools/ci/check_docs.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret and trademark scan
        run: python tools/ci/check_hygiene.py

  content:
    name: Content asset integrity
    runs-on: ubuntu-latest
    steps:
      # No LFS pull: the check inspects committed blobs, which are pointers.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: LFS pointer integrity
        run: python tools/ci/check_content.py
