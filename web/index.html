<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Last Train</title>
    <style>
      :root {
        --charcoal: #16161c;
        --violet: #6c4c9c;
        --amber: #e0a030;
        --crimson: #b02030;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--charcoal);
        color: #d8d8e0;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      }

      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: var(--charcoal);
        z-index: 100;
        transition: opacity 0.4s ease;
      }

      #boot h1 {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--amber);
      }

      #boot p {
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6a6a78;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="boot">
      <h1>Last Train</h1>
      <p id="boot-status">Starting the renderer</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
